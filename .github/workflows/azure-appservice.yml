name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Podaj nazwę swojej aplikacji utworzonej w Azure App Service
  AZURE_WEBAPP_NAME: 'twoja-nazwa-aplikacji'
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Przygotowanie środowiska Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalacja zależności
        run: npm ci

      - name: Budowanie aplikacji produkcyjnej
        run: npm run build

      - name: Przygotowanie paczki wdrożeniowej (build + zależności produkcyjne)
        run: |
          mkdir -p deploy
          cp -r build deploy/
          cp package.json deploy/
          cp package-lock.json deploy/
          cd deploy
          npm ci --omit=dev

      - name: Wdrożenie do Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy
